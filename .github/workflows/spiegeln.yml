# Fremde, per Digest gepinnte Images aus dem privaten Quell-Repo unverändert nach
# ghcr.io/eisentor/mirror/<registry>/<pfad> kopieren (öffentlich, ohne Abruf-Limit).
# Nur dieser Workflow schreibt nach ghcr; eigene Images gehen nie hierher
# (liste.py: Allowlist fremder Registries, nur nach Digest).
name: spiegeln

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: spiegeln
  cancel-in-progress: false

jobs:
  spiegeln:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Spiegel-Repo
        run: git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" spiegel

      - name: Selbsttest
        run: cd spiegel && python3 -m unittest -v test_liste.py

      - name: Quell-Repo (nur lesen; das einzige private Repo des Tokens)
        env:
          LESEN: ${{ secrets.QUELLE_LESEN }}
        run: |
          [ -n "$LESEN" ] || { echo "::error::Secret QUELLE_LESEN fehlt"; exit 1; }
          repos=$(curl -fsS -H "Authorization: Bearer $LESEN" \
            "https://api.github.com/user/repos?visibility=private&per_page=100" | jq -r '.[].full_name')
          [ "$(printf '%s\n' "$repos" | grep -c .)" = 1 ] || { echo "::error::Token muss genau ein privates Repo sehen"; exit 1; }
          echo "::add-mask::$repos"
          auth=$(printf 'x-access-token:%s' "$LESEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            clone -q --depth 1 "https://github.com/$repos.git" quelle
          # Pins offener PRs (z. B. Dependabot) gleich mit: sonst fehlt ein neuer Pin hier, bis
          # der PR gemergt ist, und Runner-Sessions können den PR nicht prüfen. Braucht am Token
          # «Pull requests: Read»; fehlt das, nur main (Warnung).
          if prs=$(curl -fsS -H "Authorization: Bearer $LESEN" \
            "https://api.github.com/repos/$repos/pulls?state=open&per_page=100" | jq -r '.[].number'); then
            for n in $prs; do
              git -C quelle -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
                fetch -q --depth 1 origin "pull/$n/head" || { echo "::warning::PR $n nicht abrufbar"; continue; }
              mkdir "pr-$n" && git -C quelle archive FETCH_HEAD | tar -x -C "pr-$n"
            done
            echo "offene PRs: $(printf '%s\n' $prs | grep -c .)"
          else
            echo "::warning::offene PRs nicht lesbar (Token ohne «Pull requests: Read»?) – nur main"
          fi

      - name: Liste
        run: |
          # main und offene PRs, jedes Image einmal
          for d in quelle pr-*; do [ -d "$d" ] && python3 spiegel/liste.py "$d"; done | sort -u > liste.tsv
          cut -f1 liste.tsv
          [ -s liste.tsv ] || { echo "::error::leere Liste"; exit 1; }

      - name: Kopieren (nach Digest, fehlende zuerst prüfen)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # grosse Laufzeit-Images (z. B. Modell-Server) braucht die CI nicht
          MAX_GB: "4"
        run: |
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fehler=0
          while IFS=$'\t' read -r quelle ziel tag digest; do
            if skopeo inspect --raw "docker://$ziel@$digest" >/dev/null 2>&1; then
              echo "vorhanden: $ziel:$tag"
              continue
            fi
            # skopeo lehnt Referenzen mit Tag und Digest ab: Quelle nur nach Digest
            quelle_digest="${quelle%@*}"; quelle_digest="${quelle_digest%:*}@$digest"
            gb=$(skopeo inspect --override-os linux --override-arch amd64 "docker://$quelle_digest" \
              | jq '[.LayersData[].Size] | add / 1e9 | floor')
            if [ "$gb" -ge "$MAX_GB" ]; then echo "übersprungen (${gb} GB > ${MAX_GB} GB): $quelle"; continue; fi
            echo "::group::kopieren $quelle"
            if skopeo copy --all --preserve-digests --retry-times 3 "docker://$quelle_digest" "docker://$ziel:$tag" 2>fehler.txt; then
              ist=$(skopeo inspect --raw "docker://$ziel:$tag" | sha256sum | cut -d' ' -f1)
              if [ "sha256:$ist" = "$digest" ]; then echo "ok: $ziel:$tag"; else echo "::error::Digest weicht ab: $ziel:$tag ($ist)"; fehler=1; fi
            else
              cat fehler.txt; echo "::error::Kopie fehlgeschlagen: $quelle: $(tail -c 400 fehler.txt | tr '\n' ' ')"; fehler=1
            fi
            echo "::endgroup::"
          done < liste.tsv
          skopeo logout ghcr.io
          exit $fehler
